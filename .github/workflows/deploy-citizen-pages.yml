name: Deploy citizen portal to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "Citizen Portal Mobile App/**"
      - ".github/workflows/deploy-citizen-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citizen-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Citizen Portal Mobile App
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Citizen Portal Mobile App/package-lock.json

      - name: Require the deployed API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [[ ! "$VITE_API_URL" =~ ^https:// ]]; then
            echo "::error::Set the repository Actions variable VITE_API_URL to the public HTTPS API URL."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build citizen portal
        run: npm run build -- --base="/${GITHUB_REPOSITORY##*/}/"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Citizen Portal Mobile App/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
