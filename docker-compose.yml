services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mzansi_connect
      POSTGRES_USER: mzansi
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - mzansi-postgres:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
volumes:
  mzansi-postgres:
